name: SAGAN CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Code Quality & Build Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run automated quality checks
        run: node scripts/check.js

      - name: Build production static site
        run: node scripts/build.js

      - name: Verify build artifacts exist
        run: |
          test -f dist/index.html
          test -f dist/styles.css
          test -f dist/app.js
          test -f dist/README.md
          test -f dist/CONTRIBUTING.md
          test -f dist/curriculum/README.md
          test -f dist/curriculum/LESSON_TEMPLATE.md
